[workspace]
authors = ["Shenghao <shzhou@udel.edu>"]
channels = ["conda-forge"]
name = "sqrtVINS"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = "cmake -B build -GNinja -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_COLOR_DIAGNOSTICS=ON -DENABLE_ARUCO_TAGS=OFF"
build = "cmake --build build -j"
test-python-api = { cmd = "python pysqrtvins/examples/smoke_test.py", depends-on = ["build"] }
xfeat-demo = { cmd = "python pysqrtvins/examples/xfeat_frontend_example.py --demo", depends-on = ["build"] }

[dependencies]
opencv = ">=4.13.0,<5"
eigen = ">=3.4.0,<4"
cxx-compiler = ">=1.11.0,<2"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
ccache = ">=4.12.2,<5"
yaml-cpp = ">=0.8.0,<0.9"
python = ">=3.14.3,<3.15"
pybind11 = ">=3.0.3,<4"
numpy = ">=2.4.2,<3"
pandas = ">=3.0.2,<4"
matplotlib = ">=3.10.8,<4"
scipy = ">=1.17.1,<2"
ceres-solver = ">=2.2.0,<3"
glog = ">=0.7.1,<0.8"
gflags = ">=2.3.1,<3"
valgrind = ">=3.27.1,<4"
