[workspace]
authors = ["Shenghao <shzhou@udel.edu>"]
channels = ["conda-forge"]
name = "sqrtVINS"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = "cmake -B build -GNinja -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_COLOR_DIAGNOSTICS=ON -DENABLE_ARUCO_TAGS=OFF"
build = "cmake --build build -j"
test = "python -m pytest test/ -x -v"

[dependencies]
opencv = ">=4.13.0,<5"
eigen = ">=3.4.0,<4"
cxx-compiler = ">=1.11.0,<2"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
ccache = ">=4.12.2,<5"
libboost-devel = ">=1.90.0,<2"
python = ">=3.11.0,<3.15"
numpy = ">=2.0.0"
scipy = ">=1.17.1,<2"
pandas = ">=3.0.2,<4"
matplotlib = ">=3.10.8,<4"
pyyaml = ">=6.0,<7"
pytest = ">=8.0,<10"

[pypi-dependencies]
# `jax-cpu` was removed from PyPI; modern JAX ships a single wheel with a CPU
# backend by default. For the RTX 2000 Ada, add `jax-cuda12-plugin` (or
# `jax-cuda13-plugin`) to the same [pypi-dependencies] section.
jax = ">=0.7.0"
